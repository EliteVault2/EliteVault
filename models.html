<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELITE VAULT | Exclusive Model Agency</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://i.ibb.co.com">
    <link rel="dns-prefetch" href="https://randomuser.me">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== PERFORMANCE: font-display swap ===== */
        @font-face {
            font-family: 'Cinzel';
            font-display: swap;
        }
        @font-face {
            font-family: 'Montserrat';
            font-display: swap;
        }
        @font-face {
            font-family: 'Playfair Display';
            font-display: swap;
        }

        :root {
            --gold: #D4AF37;
            --gold-light: #E8C84A;
            --gold-dark: #B8960F;
            --gold-glow: rgba(212, 175, 55, 0.45);
            --primary: #c80020;
            --primary-light: rgba(200, 0, 32, 0.2);
            --primary-glow: rgba(200, 0, 32, 0.5);
            --bg: #050508;
            --bg-elevated: #0a0a10;
            --card-bg: #0e0e16;
            --card-hover: #14141f;
            --glass-border: rgba(255, 255, 255, 0.07);
            --glass-bg: rgba(255, 255, 255, 0.025);
            --text: #f4f4f6;
            --text-secondary: #b0b0b8;
            --text-tertiary: #6b6b75;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
            --ease-in-out-quart: cubic-bezier(0.76, 0, 0.24, 1);
            --transition-smooth: 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            --transition-bounce: 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.4);
            --shadow-gold: 0 6px 28px rgba(212, 175, 55, 0.2);
            --shadow-primary: 0 6px 28px rgba(200, 0, 32, 0.3);
            --card-aspect: 4 / 5;
        }

        /* ===== PERFORMANCE: contain & will-change hints ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--gold-dark) var(--bg);
            font-size: 16px;
        }
        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
            -webkit-user-select: none;
            min-height: 100vh;
            position: relative;
        }

        /* ===== PERFORMANCE: GPU-accelerated orbs ===== */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(120px);
            opacity: 0.04;
            animation: orbDrift 22s ease-in-out infinite;
            will-change: transform;
            contain: layout style paint;
        }
        .ambient-orb.orb-1 {
            top: -15%;
            left: -10%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, var(--gold), transparent);
            animation-delay: 0s;
        }
        .ambient-orb.orb-2 {
            bottom: -20%;
            right: -12%;
            width: 65vw;
            height: 65vw;
            background: radial-gradient(circle, #c80020, transparent);
            animation-delay: -8s;
            animation-duration: 26s;
        }
        .ambient-orb.orb-3 {
            top: 40%;
            left: 50%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, #8b5cf6, transparent);
            animation-delay: -15s;
            animation-duration: 30s;
            opacity: 0.025;
        }
        @keyframes orbDrift {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(3%, 2%) scale(1.06);
            }
            50% {
                transform: translate(-2%, 4%) scale(0.94);
            }
            75% {
                transform: translate(2%, -3%) scale(1.04);
            }
        }

        /* ===== PERFORMANCE: grain overlay with reduced opacity ===== */
        .grain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.03;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stretch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            contain: layout style paint;
        }

        /* ===== PERFORMANCE: scroll-progress lightweight ===== */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold-light), var(--gold));
            z-index: 1001;
            transition: width 0.1s linear;
            border-radius: 0 2px 2px 0;
            box-shadow: 0 0 12px var(--gold-glow);
            will-change: width;
            contain: layout style paint;
        }

        /* ===== HEADER ===== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 6px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(8, 8, 14, 0.6);
            backdrop-filter: blur(22px) saturate(170%);
            -webkit-backdrop-filter: blur(22px) saturate(170%);
            height: 60px;
            border-bottom: 1px solid var(--glass-border);
            transition: transform 0.5s var(--ease-out-expo), background 0.5s, box-shadow 0.5s;
            will-change: transform;
            contain: layout style paint;
        }
        header.scrolled {
            background: rgba(6, 6, 12, 0.8);
            box-shadow: 0 4px 32px rgba(0, 0, 0, 0.55);
            border-bottom: 1px solid rgba(212, 175, 55, 0.18);
        }
        header.hidden {
            transform: translateY(-100%);
        }
        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2;
            flex-shrink: 0;
        }
        .img-logo {
            height: 36px;
            width: auto;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));
            transition: var(--transition-bounce);
            will-change: transform, filter;
        }
        .img-logo:hover {
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.65));
            transform: scale(1.06);
        }
        .logo {
            font-family: 'Cinzel', 'Playfair Display', serif;
            font-size: 19px;
            font-weight: 500;
            letter-spacing: 2.5px;
            color: var(--text);
            text-decoration: none;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .logo span {
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: goldShimmer 4s ease-in-out infinite;
            background-size: 200% 200%;
        }
        @keyframes goldShimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .nav-buttons {
            display: flex;
            gap: 5px;
            margin-left: 30px;
            flex-shrink: 0;
        }
        .nav-btn {
            padding: 9px 15px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 12.5px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            border-radius: 7px;
            position: relative;
            transition: var(--transition-smooth);
            overflow: hidden;
        }
        .nav-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 55%;
            height: 2px;
            background: var(--gold);
            border-radius: 2px;
            transition: transform 0.4s var(--ease-out-expo);
        }
        .nav-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.03);
        }
        .nav-btn:hover::after {
            transform: translateX(-50%) scaleX(1);
        }
        .nav-btn.active {
            color: #fff;
        }
        .nav-btn.active::after {
            transform: translateX(-50%) scaleX(1);
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }
        .nav-btn-3d {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
            color: #1a1a1a;
            border-radius: 24px;
            padding: 10px 20px;
            margin-left: 10px;
            font-weight: 700;
            box-shadow: 0 4px 18px rgba(212, 175, 55, 0.35);
            letter-spacing: 1.5px;
            transition: var(--transition-bounce);
        }
        .nav-btn-3d:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.55);
            color: #1a1a1a;
        }
        .nav-btn-3d:active {
            transform: translateY(-1px) scale(0.96);
        }

        /* ===== SEARCH ===== */
        .search-wrap {
            position: relative;
            z-index: 3;
            flex-shrink: 0;
        }
        .search-container {
            position: relative;
            width: 42px;
            height: 42px;
            transition: width 0.5s var(--ease-out-expo);
        }
        .search-container.active {
            width: 280px;
        }
        .search-input {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            padding: 0 50px 0 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 26px;
            background: rgba(18, 18, 26, 0.85);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s var(--ease-out-expo);
        }
        .search-container.active .search-input {
            opacity: 1;
            pointer-events: auto;
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 28px rgba(212, 175, 55, 0.12);
        }
        .search-trigger {
            position: absolute;
            top: 1px;
            right: 1px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d40028, #a0001e);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
            transition: var(--transition-bounce);
            box-shadow: 0 0 0 0 rgba(200, 0, 32, 0.5);
            animation: searchPulse 3s ease-in-out infinite;
        }
        @keyframes searchPulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(200, 0, 32, 0.5);
            }
            50% {
                box-shadow: 0 0 0 16px rgba(200, 0, 32, 0);
            }
        }
        .search-container.active .search-trigger {
            animation: none;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold));
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .search-trigger:hover {
            transform: scale(1.1);
        }
        .search-trigger i {
            font-size: 14px;
            transition: var(--transition-smooth);
        }
        .search-results {
            position: absolute;
            top: 52px;
            right: 0;
            width: 340px;
            max-height: 400px;
            overflow-y: auto;
            background: rgba(16, 16, 24, 0.92);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border-radius: var(--radius-md);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            opacity: 0;
            visibility: hidden;
            transform: translateY(14px);
            transition: all 0.4s var(--ease-out-expo);
            z-index: 1000;
            border: 1px solid rgba(212, 175, 55, 0.2);
            scrollbar-width: thin;
            scrollbar-color: var(--gold) transparent;
        }
        .search-container.active .search-results {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .search-result-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        .search-result-item:hover {
            background: rgba(212, 175, 55, 0.08);
        }
        .search-result-item img {
            width: 42px;
            height: 42px;
            object-fit: cover;
            border-radius: 50%;
            margin-right: 12px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: var(--transition-smooth);
        }
        .search-result-item:hover img {
            border-color: var(--gold);
            box-shadow: 0 0 14px rgba(212, 175, 55, 0.35);
        }
        .search-result-info h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .search-result-info p {
            font-size: 10px;
            color: var(--text-secondary);
        }
        .search-result-info p i {
            color: var(--gold);
            margin-right: 4px;
            font-size: 8px;
        }
        .no-results {
            padding: 28px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .no-results i {
            font-size: 30px;
            margin-bottom: 10px;
            display: block;
            color: var(--text-tertiary);
        }

        /* ===== MOBILE MENU ===== */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
            flex-shrink: 0;
        }
        .mobile-menu-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: var(--shadow-gold);
        }
        .mobile-menu {
            position: fixed;
            top: 60px;
            left: 0;
            width: 100%;
            background: rgba(8, 8, 14, 0.9);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            z-index: 999;
            padding: 18px;
            display: none;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            animation: menuSlide 0.4s var(--ease-out-expo);
        }
        @keyframes menuSlide {
            from {
                opacity: 0;
                transform: translateY(-18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .mobile-menu.active {
            display: flex;
        }
        .mobile-nav-btn-3d {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
            color: #1a1a1a;
            border-radius: 24px;
            padding: 12px 20px;
            text-align: center;
            font-weight: 700;
            box-shadow: 0 4px 18px rgba(212, 175, 55, 0.35);
            letter-spacing: 1.5px;
            border: none;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            padding-top: 100px;
            min-height: 100vh;
            padding-bottom: 80px;
            position: relative;
            z-index: 2;
        }
        .page-title {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInUp 0.9s var(--ease-out-expo);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(28px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .page-title h1 {
            font-family: 'Cinzel', 'Playfair Display', serif;
            font-size: 44px;
            font-weight: 500;
            letter-spacing: 4px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--gold-light), #f0f0f0, #c8e6ff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleShimmer 5s ease-in-out infinite;
            background-size: 300% 300%;
        }
        @keyframes titleShimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .page-title p {
            color: var(--text-secondary);
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }
        .page-title p::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            border-radius: 2px;
        }
        .model-count-badge {
            display: inline-block;
            background: rgba(212, 175, 55, 0.12);
            color: var(--gold-light);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-top: 16px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            animation: fadeInUp 0.9s var(--ease-out-expo) 0.2s both;
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
            padding: 0 5%;
            animation: fadeInUp 0.9s var(--ease-out-expo) 0.3s both;
        }
        .filter-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            border-radius: 24px;
            transition: var(--transition-bounce);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            position: relative;
            overflow: hidden;
        }
        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border-color: rgba(212, 175, 55, 0.45);
            transform: translateY(-2px);
            box-shadow: var(--shadow-gold);
        }
        .filter-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 6px 24px rgba(200, 0, 32, 0.4);
            animation: filterGlow 2s ease-in-out infinite;
        }
        @keyframes filterGlow {
            0%,
            100% {
                box-shadow: 0 6px 24px rgba(200, 0, 32, 0.4);
            }
            50% {
                box-shadow: 0 6px 34px rgba(200, 0, 32, 0.6);
            }
        }
        .view-toggle {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 22px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .view-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-bounce);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .view-btn.active {
            background: rgba(212, 175, 55, 0.2);
            color: var(--gold-light);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.2);
        }
        .view-btn:hover {
            color: #fff;
        }

        /* ===== ALPHABET FILTER ===== */
        .alphabet-filter {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 3px;
            margin-bottom: 28px;
            padding: 0 3%;
            opacity: 0;
            height: 0;
            overflow: hidden;
            transition: all 0.5s var(--ease-out-expo);
            pointer-events: none;
        }
        .alphabet-filter.active {
            opacity: 1;
            height: auto;
            padding: 6px 3%;
            pointer-events: auto;
        }
        .alphabet-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1.5px solid rgba(255, 255, 255, 0.07);
            color: var(--text-secondary);
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            border-radius: 50%;
            transition: var(--transition-bounce);
            text-transform: uppercase;
        }
        .alphabet-btn:hover {
            background: rgba(212, 175, 55, 0.12);
            color: #fff;
            border-color: rgba(212, 175, 55, 0.5);
            transform: translateY(-2px);
            box-shadow: var(--shadow-gold);
        }
        .alphabet-btn.active {
            background: var(--gold);
            color: #1a1a1a;
            border-color: var(--gold);
            box-shadow: 0 4px 18px rgba(212, 175, 55, 0.45);
            font-weight: 700;
        }

        /* ===== MODELS GRID ===== */
        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 0 5%;
            margin-bottom: 50px;
        }
        .models-grid.list-view {
            grid-template-columns: 1fr;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            gap: 12px;
        }

        /* ===== PERFORMANCE: card with contain & content-visibility ===== */
        .model-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-card);
            position: relative;
            opacity: 0;
            transform: translateY(20px);

            // ============ DOM REFS (cached) ============
            const $ = (s) => document.querySelector(s);

            const mobileMenuBtn = $('#mobileMenuBtn');

            // ============ STATE ============
            let currentPage = 1;
            const modelsPerPage = 24;
            let totalPages = Math.ceil(modelData.length / modelsPerPage);
            let currentFilter = 'popular';
            let currentLetter = 'all';
            let currentSearchQuery = '';
            let currentView = 'grid';
            let favorites = JSON.parse(localStorage.getItem('evFavorites') || '[]');
            let toastTimer = null;
            let scrollRAF = null;
            let lastScrollY = 0;

            // ============ TOAST ============
            function showToast(msg) {
                if (toastTimer) { clearTimeout(toastTimer);
                    toastTimer = null; }
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
            }

            // ============ FAVORITES ============
            function toggleFavorite(modelId, e) {
                e.stopPropagation();
                e.preventDefault();
                const idx = favorites.indexOf(modelId);
                if (idx > -1) { favorites.splice(idx, 1);
                    showToast('Removed from favorites'); } else { favorites.push(modelId);
                    showToast('Added to favorites ✦'); }
                localStorage.setItem('evFavorites', JSON.stringify(favorites));
                renderModels();
                updatePagination();
            }

            function isFavorited(modelId) { return favorites.includes(modelId); }

            // ============ QUICK VIEW MODAL ============
            function openQuickView(model, e) {
                if (e && e.target && e.target.closest('.favorite-btn')) return;
                modalContent.innerHTML =
                    `
              <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
              <img src="${model.image}" alt="${model.name}" class="modal-image" loading="lazy" decoding="async">
              <div class="modal-info">
                <h2>${model.name}</h2>
                <p><i class="fas fa-map-marker-alt" style="color:var(--gold);margin-right:6px;"></i>${model.location||'N/A'}</p>
                <p><i class="fas fa-fire" style="color:var(--gold);margin-right:6px;"></i>Popularity: ${model.popularity||'N/A'}%</p>
                <a href="${model.url}" class="modal-action">View Full Profile <i class="fas fa-arrow-right" style="margin-left:6px;"></i></a>
              </div>`;
                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                const closeBtn = document.getElementById('modalClose');
                if (closeBtn) closeBtn.addEventListener('click', closeModal);
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }
            modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

            // ============ NAVIGATION ============
            function setupNav() {
                const navMap = {
                    homeBtn: 'index.html',
                    modelsBtn: null,
                    videosBtn: 'videos.html',
                    threeDBtn: '3d.html',
                    mobileHomeBtn: 'index.html',
                    mobileModelsBtn: null,
                    mobileVideosBtn: 'videos.html',
                    mobileThreeDBtn: '3d.html',
                };
                Object.entries(navMap).forEach(([id, url]) => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    if (url) el.addEventListener('click', () => { window.location.href = url; });
                    else el.addEventListener('click', (e) => {
                        e.preventDefault();
                        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                        const modelsBtn = document.getElementById('modelsBtn');
                        const mobileModelsBtn = document.getElementById('mobileModelsBtn');
                        if (modelsBtn) modelsBtn.classList.add('active');
                        if (mobileModelsBtn) mobileModelsBtn.classList.add('active');
                        mobileMenu.classList.remove('active');
                    });
                });
                mobileMenuBtn.addEventListener('click', () => mobileMenu.classList.toggle('active'));
                document.addEventListener('click', (e) => {
                    if (!mobileMenu.contains(e.target) && e.target !== mobileMenuBtn && !mobileMenuBtn
                        .contains(e.target)) {
                        mobileMenu.classList.remove('active');
                    }
                });
            }

            // ============ SEARCH (debounced) ============
            let searchDebounceTimer = null;

            function setupSearch() {
                searchTrigger.addEventListener('click', () => {
                    searchContainer.classList.toggle('active');
                    if (searchContainer.classList.contains('active')) {
                        searchInput.focus();
                    } else {
                        searchInput.value = '';
                        searchResults.innerHTML = '';
                        currentSearchQuery = '';
                        currentPage = 1;
                        renderModels();
                        updatePagination();
                    }
                });
                searchInput.addEventListener('input', () => {
                    if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
                    searchDebounceTimer = setTimeout(() => {
                        currentSearchQuery = searchInput.value.toLowerCase().trim();
                        if (!currentSearchQuery) {
                            searchResults.innerHTML = '';
                            currentPage = 1;
                            renderModels();
                            updatePagination();
                            return;
                        }
                        const filtered = modelData.filter(m => m.name.toLowerCase().includes(
                            currentSearchQuery) ||
                            (m.location && m.location.toLowerCase().includes(currentSearchQuery)));
                        displaySearchResults(filtered);
                        currentPage = 1;
                        renderModels();
                        updatePagination();
                    }, 180);
                });
                document.addEventListener('click', (e) => {
                    if (!searchContainer.contains(e.target) && !searchTrigger.contains(e.target)) {
                        if (searchContainer.classList.contains('active') && !currentSearchQuery) {
                            searchContainer.classList.remove('active');
                            searchInput.value = '';
                            searchResults.innerHTML = '';
                        }
                    }
                });
            }

            function displaySearchResults(results) {
                searchResults.innerHTML = '';
                if (!results.length) {
                    searchResults.innerHTML =
                        '<div class="no-results"><i class="fas fa-search"></i><p>No Models Found</p></div>';
                    return;
                }
                const frag = document.createDocumentFragment();
                results.slice(0, 5).forEach((m, i) => {
                    const div = document.createElement('div');
                    div.className = 'search-result-item';
                    div.style.opacity = '0';
                    div.style.transform = 'translateX(-8px)';
                    div.style.transition = `all 0.3s ease-out ${i*0.04}s`;
                    div.innerHTML =
                        `
                <img src="${m.image}" alt="${m.name}" loading="lazy" decoding="async">
                <div class="search-result-info"><h3>${m.name}</h3><p><i class="fas fa-map-marker-alt"></i>${m.location||'N/A'} · <i class="fas fa-fire"></i>${m.popularity||'N/A'}%</p></div>
                <i class="fas fa-chevron-right" style="margin-left:auto;color:var(--text-tertiary);"></i>`;
                    div.addEventListener('click', () => { window.location.href = m.url; });
                    frag.appendChild(div);
                    requestAnimationFrame(() => { div.style.opacity = '1';
                        div.style.transform = 'translateX(0)'; });
                });
                searchResults.appendChild(frag);
            }

            // ============ RENDER (batch DOM) ============
            function renderModels() {
                modelsGrid.innerHTML = '';
                let filtered = [...modelData];
                if (currentSearchQuery) {
                    filtered = filtered.filter(m => m.name.toLowerCase().includes(currentSearchQuery) || (m
                        .location && m.location.toLowerCase().includes(currentSearchQuery)));
                } else if (currentFilter === 'popular') {
                    filtered.sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
                } else if (currentFilter === 'alphabetical') {
                    filtered.sort((a, b) => a.name.localeCompare(b.name));
                    if (currentLetter !== 'all') filtered = filtered.filter(m => m.name.toLowerCase().startsWith(
                        currentLetter));
                }
                totalPages = Math.ceil(filtered.length / modelsPerPage);
                if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
                const start = (currentPage - 1) * modelsPerPage;
                const show = filtered.slice(start, start + modelsPerPage);
                modelCountBadge.textContent = `✦ ${filtered.length} ELITE MODELS ✦`;
                const frag = document.createDocumentFragment();
                show.forEach((m, i) => {
                    const fav = isFavorited(m.id);
                    const card = document.createElement('div');
                    card.className = 'model-card';
                    card.style.animationDelay = `${i*0.025}s`;
                    card.innerHTML =
                        `
                <div class="model-image-container">
                  <img src="${m.image}" alt="${m.name}" class="model-image" loading="lazy" decoding="async">
                  <div class="model-badge">✦ ELITE</div>
                  <button class="favorite-btn${fav?' favorited':''}" data-id="${m.id}" aria-label="Favorite"><i class="fas fa-heart"></i></button>
                </div>
                <a href="${m.url}" class="model-card-link" style="position:static;">
                  <div class="model-info">
                    <h3 class="model-name">${m.name}</h3>
                    <div class="model-stats">
                      <div class="model-stat"><i class="fas fa-map-marker-alt"></i>${m.location||'N/A'}</div>
                      <div class="model-stat"><i class="fas fa-fire"></i>${m.popularity||'N/A'}%</div>
                    </div>
                  </div>
                </a>`;
                    card.querySelector('.favorite-btn').addEventListener('click', (e) => toggleFavorite(m.id,
                        e));
                    card.addEventListener('click', (e) => { if (!e.target.closest('.favorite-btn'))
                        openQuickView(m, e); });
                    frag.appendChild(card);
                });
                modelsGrid.appendChild(frag);
            }

            function updatePagination() {
                pagination.innerHTML = '';
                const mkBtn = (t, act, dis, fn) => {
                    const b = document.createElement('button');
                    b.className = `page-btn${act?' active':''}${dis?' disabled':''}`;
                    b.innerHTML = t;
                    if (!dis && fn) b.addEventListener('click', fn);
                    return b;
                };
                const goToPage = (p) => {
                    if (p !== currentPage) {
                        currentPage = p;
                        renderModels();
                        updatePagination();
                        window.scrollTo({ top: 300, behavior: 'smooth' });
                    }
                };
                pagination.appendChild(mkBtn('<i class="fas fa-chevron-left"></i>', false, currentPage === 1, () => {
                    if (currentPage > 1) goToPage(currentPage - 1);
                }));
                pagination.appendChild(mkBtn('1', currentPage === 1, false, () => goToPage(1)));
                if (totalPages > 1) {
                    let sp, ep;
                    if (totalPages <= 5) { sp = 2;
                        ep = totalPages - 1; } else if (currentPage <= 3) { sp = 2;
                        ep = 5; } else if (currentPage >= totalPages - 2) { sp = totalPages - 4;
                        ep = totalPages - 1; } else { sp = currentPage - 2;
                        ep = currentPage + 2; }
                    if (sp > 2) { const d = document.createElement('span');
                        d.className = 'page-dots';
                        d.textContent = '...';
                        pagination.appendChild(d); }
                    for (let i = sp; i <= ep; i++) {
                        if (i < totalPages) pagination.appendChild(mkBtn(String(i), currentPage === i, false,
                        () => goToPage(i)));
                    }
                    if (ep < totalPages - 1) { const d = document.createElement('span');
                        d.className = 'page-dots';
                        d.textContent = '...';
                        pagination.appendChild(d); }
                    pagination.appendChild(mkBtn(String(totalPages), currentPage === totalPages, false, () =>
                        goToPage(totalPages)));
                }
                pagination.appendChild(mkBtn('<i class="fas fa-chevron-right"></i>', false, currentPage ===
                    totalPages, () => {
                    if (currentPage < totalPages) goToPage(currentPage + 1);
                }));
            }

            // ============ ALPHABET FILTER ============
            function buildAlphabetFilter() {
                alphabetFilter.innerHTML = '';
                const letters = 'abcdefghijklmnopqrstuvwxyz'.split('');
                const frag = document.createDocumentFragment();
                const allBtn = document.createElement('button');
                allBtn.className = 'alphabet-btn active';
                allBtn.dataset.letter = 'all';
                allBtn.textContent = 'All';
                allBtn.addEventListener('click', () => {
                    document.querySelectorAll('.alphabet-btn').forEach(b => b.classList.remove('active'));
                    allBtn.classList.add('active');
                    currentLetter = 'all';
                    currentPage = 1;
                    renderModels();
                    updatePagination();
                });
                frag.appendChild(allBtn);
                letters.forEach(l => {
                    const btn = document.createElement('button');
                    btn.className = 'alphabet-btn';
                    btn.dataset.letter = l;
                    btn.textContent = l.toUpperCase();
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.alphabet-btn').forEach(b => b.classList.remove(
                        'active'));
                        btn.classList.add('active');
                        currentLetter = l;
                        currentPage = 1;
                        renderModels();
                        updatePagination();
                    });
                    frag.appendChild(btn);
                });
                alphabetFilter.appendChild(frag);
            }

            // ============ EVENTS (throttled scroll) ============
            function setupEvents() {
                // Throttled scroll handler using requestAnimationFrame
                const handleScroll = () => {
                    if (scrollRAF) return;
                    scrollRAF = requestAnimationFrame(() => {
                        const s = window.pageYOffset;
                        const docH = document.documentElement.scrollHeight - window.innerHeight;
                        scrollProgress.style.width = docH > 0 ? `${(s/docH)*100}%` : '0%';
                        if (s <= 0) {
                            mainHeader.classList.remove('hidden', 'scrolled');
                        } else {
                            if (s > 40) mainHeader.classList.add('scrolled');
                            else mainHeader.classList.remove('scrolled');
                            if (s > lastScrollY && s > 100 && !mainHeader.classList.contains('hidden'))
                                mainHeader.classList.add('hidden');
                            else if (s < lastScrollY && mainHeader.classList.contains('hidden'))
                                mainHeader.classList.remove('hidden');
                        }
                        lastScrollY = s;
                        if (s > 300) backToTopBtn.classList.add('visible');
                        else backToTopBtn.classList.remove('visible');
                        scrollRAF = null;
                    });
                };
                window.addEventListener('scroll', handleScroll, { passive: true });

                backToTopBtn.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });

                const popBtn = document.getElementById('popularBtn');
                const alphaBtn = document.getElementById('alphabeticalBtn');
                if (popBtn) {
                    popBtn.addEventListener('click', () => {
                        currentSearchQuery = '';
                        searchInput.value = '';
                        searchResults.innerHTML = '';
                        popBtn.classList.add('active');
                        if (alphaBtn) alphaBtn.classList.remove('active');
                        alphabetFilter.classList.remove('active');
                        currentFilter = 'popular';
                        currentPage = 1;
                        renderModels();
                        updatePagination();
                    });
                }
                if (alphaBtn) {
                    alphaBtn.addEventListener('click', () => {
                        currentSearchQuery = '';
                        searchInput.value = '';
                        searchResults.innerHTML = '';
                        alphaBtn.classList.add('active');
                        if (popBtn) popBtn.classList.remove('active');
                        alphabetFilter.classList.add('active');
                        currentFilter = 'alphabetical';
                        currentPage = 1;
                        renderModels();
                        updatePagination();
                    });
                }

                const gridBtn = document.getElementById('gridViewBtn');
                const listBtn = document.getElementById('listViewBtn');
                if (gridBtn) {
                    gridBtn.addEventListener('click', () => {
                        currentView = 'grid';
                        modelsGrid.classList.remove('list-view');
                        gridBtn.classList.add('active');
                        if (listBtn) listBtn.classList.remove('active');
                    });
                }
                if (listBtn) {
                    listBtn.addEventListener('click', () => {
                        currentView = 'list';
                        modelsGrid.classList.add('list-view');
                        listBtn.classList.add('active');
                        if (gridBtn) gridBtn.classList.remove('active');
                    });
                }
            }

            // ============ INIT ============
            function init() {
                setupNav();
                setupSearch();
                setupEvents();
                buildAlphabetFilter();
                renderModels();
                updatePagination();
                if (currentView === 'list') {
                    modelsGrid.classList.add('list-view');
                    const listBtn = document.getElementById('listViewBtn');
                    const gridBtn = document.getElementById('gridViewBtn');
                    if (listBtn) listBtn.classList.add('active');
                    if (gridBtn) gridBtn.classList.remove('active');
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
